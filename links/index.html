<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LIMBOPIX | Photo + Design Duo | Orlando, FL</title>
  <meta name="description" content="Mauricio shoots. Lissette designs. Photo + Design duo in Orlando, FL. Grad portraits, food photography, and brand design." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      width: 100%;
      background: linear-gradient(180deg, #FFFDF9 0%, #F7A868 52%, #EC6D26 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      color: #2C2623;
    }

    /* Full-Screen Frosted Glass Layer */
    .glass-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(45px);
      -webkit-backdrop-filter: blur(45px);
      pointer-events: none;
      z-index: 1;
    }

    /* Main Mobile Container (Centered on Desktop & Full-Fit on Mobile) */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      min-height: 100dvh;
      padding: 56px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .top-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Circular Brand Logo Mark */
    .logo-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background-color: #EC6D26;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(236, 109, 38, 0.25);
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      color: #EC6D26;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .bio-tagline {
      font-size: 15.5px;
      font-weight: 600;
      color: #2C2623;
      margin-bottom: 6px;
    }

    .bio-sub {
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(44, 38, 35, 0.88);
      margin-bottom: 6px;
    }

    .bio-services {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(44, 38, 35, 0.8);
      margin-bottom: 34px;
      line-height: 1.4;
    }

    /* Buttons Stack */
    .links-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: 15.5px;
      font-weight: 600;
      transition: transform 0.16s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Primary Solid CTA ("Our Work") */
    .btn-primary {
      background-color: #EC6D26;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(236, 109, 38, 0.35);
    }

    .btn-primary:hover {
      background-color: #e0611b;
      box-shadow: 0 10px 24px rgba(236, 109, 38, 0.45);
    }

    /* Secondary Frosted Glass Buttons */
    .btn-glass {
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #2C2623;
      box-shadow: 0 6px 16px rgba(44, 38, 35, 0.08);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .btn svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    /* Bottom Social & Footer Sign-off */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .social-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #2C2623;
      color: #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.16s ease, opacity 0.16s ease;
      box-shadow: 0 4px 12px rgba(44, 38, 35, 0.18);
    }

    .social-circle:hover {
      transform: scale(1.06);
    }

    .social-circle svg {
      width: 20px;
      height: 20px;
    }

    .footer-tagline {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="glass-backdrop"></div>

  <main class="container">
    <div class="top-section">
      <!-- Circular Logo Mark -->
      <div class="logo-circle" aria-label="LIMBOPIX Logo">
        <svg width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Top-left crop corner -->
          <path d="M11 19V13H17" stroke="white" stroke-width="3" stroke-linecap="square"/>
          <!-- Bottom-right crop corner -->
          <path d="M37 29V35H31" stroke="white" stroke-width="3" stroke-linecap="square"/>
          <!-- Sparkle top-right -->
          <path d="M33.5 11V16M31 13.5H36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <!-- Center Circle with Pen Nib Cutout -->
          <circle cx="24" cy="24" r="9.5" fill="white"/>
          <path d="M18.5 29.5L23.5 21.5L28 23L26.5 27.5L18.5 29.5Z" fill="#EC6D26"/>
          <path d="M23.5 21.5L28.5 18.5L28 23" fill="#EC6D26"/>
        </svg>
      </div>

      <h1 class="brand-title">LIMBOPIX</h1>

      <p class="bio-tagline">Mauricio shoots. Lissette designs.</p>
      <p class="bio-sub">Photo + Design duo | Orlando, FL</p>
      <p class="bio-services">Grad portraits &middot; Food photography &middot; Brand design</p>

      <!-- CTA Button Stack -->
      <nav class="links-stack">
        <!-- 1. Primary CTA: Our Work -->
        <a href="https://limbopix.com" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span>Our Work</span>
        </a>

        <!-- 2. Secondary Glass CTA: Grad Photo Ideas -->
        <a href="https://limbopix.com/gallery.html" class="btn btn-glass">
          <span>Grad Photo Ideas</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </a>

        <!-- 3. Secondary Glass CTA: Our Instagram -->
        <a href="https://www.instagram.com/limbopix" target="_blank" rel="noopener noreferrer" class="btn btn-glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span>Our Instagram</span>
        </a>

        <!-- 4. Secondary Glass CTA: Email Us (Direct Native Mail Trigger) -->
        <a href="mailto:studio@limbopix.com?subject=Booking%20Inquiry%20%7C%20LIMBOPIX" class="btn btn-glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>Email Us</span>
        </a>
      </nav>
    </div>

    <!-- Bottom TikTok + Tagline -->
    <footer class="bottom-section">
      <a href="https://www.tiktok.com/@limbopix" target="_blank" rel="noopener noreferrer" class="social-circle" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
        </svg>
      </a>
      <p class="footer-tagline">Framing moments &bull; Designing dreams</p>
    </footer>
  </main>

</body>
</html>
