<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LIMBOPIX | Photo + Design Duo | Orlando, FL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      /* Matches your warm gradient on wide desktop screens */
      background: linear-gradient(180deg, #FFFBF5 0%, #F7B279 48%, #EE7623 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Displays your exact 402x874 Figma export */
    .figma-canvas {
      position: relative;
      width: 100%;
      max-width: 402px;
    }

    .figma-canvas img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Invisible clickable button zones aligned to your Figma frame */
    .hitbox {
      position: absolute;
      left: 17%;
      width: 66%;
      height: 5.5%;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      z-index: 10;
    }

    .hitbox:active {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* 1. Our Website */
    .btn-website {
      top: 40.5%;
    }

    /* 2. Our Instagram */
    .btn-instagram {
      top: 49.0%;
    }

    /* 3. Email Us */
    .btn-email {
      top: 57.5%;
    }

    /* 4. TikTok Icon */
    .btn-tiktok {
      position: absolute;
      top: 68.5%;
      left: 43%;
      width: 14%;
      height: 5.5%;
      border-radius: 50%;
      z-index: 10;
    }
  </style>
</head>
<body>

  <main class="figma-canvas">
    <!-- Your exact exported Figma frame -->
    <img src="links-bg.png" alt="LIMBOPIX - Mauricio shoots. Lissette designs." />

    <!-- 1. Our Website -->
    <a href="https://limbopix.com" class="hitbox btn-website" aria-label="Our Website"></a>

    <!-- 2. Our Instagram -->
    <a href="https://www.instagram.com/limbopix" target="_blank" rel="noopener noreferrer" class="hitbox btn-instagram" aria-label="Our Instagram"></a>

    <!-- 3. Email Us -->
    <a href="mailto:studio@limbopix.com?subject=Booking%20Inquiry%20%7C%20LIMBOPIX" class="hitbox btn-email" aria-label="Email Us"></a>

    <!-- 4. TikTok -->
    <a href="https://www.tiktok.com/@limbopix" target="_blank" rel="noopener noreferrer" class="btn-tiktok" aria-label="TikTok"></a>
  </main>

</body>
</html>
